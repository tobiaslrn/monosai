<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The fonts the screenshot baselines are drawn in. The pinned Playwright image
  resolves the interface's `system-ui` to a CJK face whose Latin glyphs look
  like nothing a learner's phone shows. This puts a Latin face first and keeps
  the image's IPA Gothic for Japanese, so the baselines read like the app while
  staying identical on every run of the same image. Only the visual suite loads
  it, through FONTCONFIG_FILE.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test qual="any" name="family"><string>system-ui</string></test>
    <edit name="family" mode="assign" binding="strong"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Liberation Sans</string>
      <string>IPAPGothic</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Liberation Mono</string>
      <string>IPAGothic</string>
    </edit>
  </match>
</fontconfig>
