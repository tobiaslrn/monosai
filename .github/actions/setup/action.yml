name: Set up Node and dependencies
description: >
  Reads the Node version from .nvmrc so local and CI cannot drift, then
  installs from the lockfile with the npm cache warm.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: web/package-lock.json
    - run: npm ci
      working-directory: web
      shell: bash
