name: Set up Rust and the cargo tools
description: >
  Installs the toolchain rust-toolchain.toml pins, restores the cargo cache,
  and installs prebuilt binaries of exactly the tool versions
  `cargo xtask tools --list` names, so local and CI cannot drift.

runs:
  using: composite
  steps:
    - run: rustup toolchain install
      shell: bash
    - uses: Swatinem/rust-cache@v2
    - id: tools
      run: echo "list=$(cargo xtask tools --list)" >> "$GITHUB_OUTPUT"
      shell: bash
    - uses: taiki-e/install-action@v2
      with:
        tool: ${{ steps.tools.outputs.list }}
