name: Release Android bridge

# The bridge publishes itself. `android-bridge/version.txt` is the source of
# truth: every push to `main` asks whether that version already has a release,
# publishes it if it does not, and fails loudly if the APK's own sources moved
# on without the version moving with them. Nobody has to push a tag, and a user
# never has to dig a build artifact out of a CI run to install the bridge.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A second push must wait rather than race the first one's tag.
concurrency:
  group: bridge-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish the signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags and history: the drift check below compares this commit with
          # the tag of the release that is already published.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Read and validate the committed version
        run: |
          node --test scripts/bridge/release-version.test.mjs
          node scripts/bridge/release-version.mjs

      - name: Decide whether this version still needs a release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$BRIDGE_TAG" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$BRIDGE_TAG is already published."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$BRIDGE_TAG has no release yet; building one."
          fi

      # A published version whose APK sources have moved is the failure this
      # whole workflow exists to prevent: the release people download would no
      # longer be the bridge in `main`. The bundled licence notices are left out
      # because they follow the PWA's dependencies, not the bridge's behaviour.
      - name: Fail if the APK changed without a version bump
        if: steps.decide.outputs.needed == 'false'
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BRIDGE_TAG" HEAD -- \
            android-bridge/app/src/main android-bridge/app/build.gradle.kts \
            android-bridge/build.gradle.kts android-bridge/settings.gradle.kts \
            android-bridge/gradle android-bridge/gradle.properties)
          if [ -n "$changed" ]; then
            echo "::error::The bridge APK changed since $BRIDGE_TAG was published. Raise android-bridge/version.txt so the new build reaches Releases."
            printf '%s\n' "$changed"
            exit 1
          fi
          echo "The published $BRIDGE_TAG still matches this commit."

      - name: Check that signing material is configured
        id: signing
        if: steps.decide.outputs.needed == 'true'
        env:
          KEYSTORE: ${{ secrets.BRIDGE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE:-}" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "::warning::$BRIDGE_TAG is ready to publish, but no signing key is configured. Set the BRIDGE_KEYSTORE_BASE64, BRIDGE_STORE_PASSWORD, BRIDGE_KEY_ALIAS and BRIDGE_KEY_PASSWORD repository secrets, then re-run this workflow. An unsigned release is never published, and a missing key never fails the branch."
          fi

      - name: Verify before touching the signing key
        if: steps.signing.outputs.ready == 'true'
        run: |
          node scripts/bridge/icons.mjs --check
          cd android-bridge
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:runtimeLicenses
      - name: Check the resolved APK dependency graph and licences
        if: steps.signing.outputs.ready == 'true'
        run: node scripts/licenses/check-licenses.mjs --check --gradle-report android-bridge/app/build/reports/runtime-dependencies.json

      - name: Sign the release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: android-bridge
        env:
          BRIDGE_KEYSTORE_BASE64: ${{ secrets.BRIDGE_KEYSTORE_BASE64 }}
          BRIDGE_STORE_PASSWORD: ${{ secrets.BRIDGE_STORE_PASSWORD }}
          BRIDGE_KEY_ALIAS: ${{ secrets.BRIDGE_KEY_ALIAS }}
          BRIDGE_KEY_PASSWORD: ${{ secrets.BRIDGE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export BRIDGE_KEYSTORE="$RUNNER_TEMP/bridge-release.jks"
          trap 'rm -f "$BRIDGE_KEYSTORE"' EXIT
          printf '%s' "$BRIDGE_KEYSTORE_BASE64" | base64 --decode > "$BRIDGE_KEYSTORE"
          ./gradlew :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/monosai-bridge.apk"

      # The tag is created here, from this commit, rather than pushed by hand.
      - name: Publish the release
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$BRIDGE_TAG" "$RUNNER_TEMP/monosai-bridge.apk" \
            --target "$GITHUB_SHA" --title "Monosai Bridge $BRIDGE_VERSION_NAME" \
            --notes-file android-bridge/release-notes.md --latest
          echo "::notice::Published $BRIDGE_TAG."
