name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Never deploy from an untested tree.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:pages -- --define MONOSAI_BUILD_COMMIT='"${{ github.sha }}"'
      - name: Add SPA 404 fallback
        run: cp dist/monosai/browser/index.html dist/monosai/browser/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/monosai/browser
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Post-deploy smoke test
        run: |
          curl --fail --silent --show-error --location "${{ steps.deployment.outputs.page_url }}" > /dev/null
