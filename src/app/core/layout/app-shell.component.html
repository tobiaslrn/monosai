<a class="mn-skip-link" href="#mn-main">Skip to main content</a>

<div class="shell" [class.shell--desktop]="viewport.isDesktop()">
  @if (viewport.isDesktop()) {
    <mn-sidebar-nav [items]="items" [compact]="viewport.isSidebarCompact()" />
  }

  <main id="mn-main" class="main" tabindex="-1">
    <router-outlet />
  </main>

  @if (!viewport.isDesktop()) {
    <mn-bottom-nav
      [items]="barItems()"
      [hasMore]="moreItems().length > 0"
      (moreOpened)="openMore()"
    />
  }
</div>
