[package]
name = "monosai-engine-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.monosai]
kind = "glue"

[lib]
# The module the engine worker loads; `rlib` keeps it checkable natively.
crate-type = ["cdylib", "rlib"]
doctest = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures = { workspace = true, features = ["std"] }
js-sys.workspace = true
monosai-engine.workspace = true
monosai-engine-api.workspace = true
monosai-kernel.workspace = true
monosai-platform.workspace = true
serde = { workspace = true, features = ["std"] }
serde-wasm-bindgen.workspace = true
thiserror.workspace = true
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["fmt"] }
wasm-bindgen = { workspace = true, features = ["std"] }
wasm-bindgen-futures = { workspace = true, features = ["std"] }
web-sys = { workspace = true, features = ["console"] }

[lints]
workspace = true
